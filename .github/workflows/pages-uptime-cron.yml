name: Pages uptime (scheduled)

# Re-enables GitHub Pages for this repository (workflow builds) and triggers a
# fresh deploy from `.github/workflows/pages.yml`.
#
# GitHub `schedule` uses UTC. To target 07:00 in a UTC+8 timezone (e.g. Manila),
# use minute 0, hour 23 UTC: `0 23 * * *`.
#
# Scheduled runs stop after 2026-05-30 (UTC date). `workflow_dispatch` ignores
# that end date so you can still run these steps manually if needed.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  pages: write
  actions: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run scheduled job
        id: gate
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          if [[ "${today}" > "2026-05-30" ]]; then
            echo "Past 2026-05-30; skipping scheduled uptime."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure GitHub Pages (workflow) and trigger deploy
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pages_api="https://api.github.com/repos/${owner}/${repo}/pages"
          dispatch_api="https://api.github.com/repos/${owner}/${repo}/actions/workflows/pages.yml/dispatches"

          put_code="$(curl -sS \
            -o /tmp/put_pages_body.txt \
            -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${pages_api}" \
            -d '{"build_type":"workflow"}')"

          cat /tmp/put_pages_body.txt || true

          case "${put_code}" in
            200|201)
              echo "Pages configured (${put_code})."
              ;;
            *)
              echo "Unexpected PUT /pages HTTP status: ${put_code}"
              exit 1
              ;;
          esac

          post_code="$(curl -sS \
            -o /tmp/dispatch_body.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${dispatch_api}" \
            -d '{"ref":"main"}')"

          cat /tmp/dispatch_body.txt || true

          case "${post_code}" in
            204)
              echo "Triggered workflow deploy (${post_code})."
              ;;
            *)
              echo "Unexpected workflow dispatch HTTP status: ${post_code}"
              exit 1
              ;;
          esac
