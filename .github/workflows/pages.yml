name: Deploy web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/checkout@v4
        with:
          repository: knowWHERE-team/knowWHERE
          ref: main
          token: ${{ secrets.KNOWWHERE_REPO_TOKEN }}

      - name: Prepare site content
        run: |
          # If `web/` is source code, build it; if it's already static, this is a no-op.
          if [ ! -f web/index.html ] && [ -f web/package.json ]; then
            (cd web && npm ci && npm run build)
          fi

          SITE_SRC="web"
          if [ -f web/index.html ]; then
            SITE_SRC="web"
          elif [ -f web/dist/index.html ]; then
            SITE_SRC="web/dist"
          elif [ -f web/build/index.html ]; then
            SITE_SRC="web/build"
          elif [ -f web/out/index.html ]; then
            SITE_SRC="web/out"
          else
            echo "No index.html found under web/, web/dist, web/build, or web/out"
            ls -la web
            exit 1
          fi

          rm -rf public
          mkdir -p public
          cp -r "$SITE_SRC"/. public/
          touch public/.nojekyll
          test -f public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4