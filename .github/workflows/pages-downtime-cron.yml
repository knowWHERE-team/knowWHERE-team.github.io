name: Pages downtime (scheduled)

# Disables the GitHub Pages site for this repository via the REST API.
#
# GitHub `schedule` uses UTC. To target 21:00 in a UTC+8 timezone (e.g. Manila),
# use minute 0, hour 13 UTC: `0 13 * * *`.
#
# Scheduled runs stop after 2026-05-30 (UTC date). `workflow_dispatch` ignores
# that end date so you can still run these steps manually if needed.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  downtime:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run scheduled job
        id: gate
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          if [[ "${today}" > "2026-05-30" ]]; then
            echo "Past 2026-05-30; skipping scheduled downtime."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Delete GitHub Pages site
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          api="https://api.github.com/repos/${owner}/${repo}/pages"

          code="$(curl -sS \
            -o /tmp/delete_pages_body.txt \
            -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          cat /tmp/delete_pages_body.txt || true

          case "${code}" in
            204) echo "Pages disabled (${code})." ;;
            404) echo "Pages was not enabled (${code}); nothing to do." ;;
            *)
              echo "Unexpected DELETE /pages HTTP status: ${code}"
              exit 1
              ;;
          esac
